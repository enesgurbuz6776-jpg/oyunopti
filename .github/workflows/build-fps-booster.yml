name: Build OyunOpti FPS Booster
on:
  push:
    branches: [main]
    paths:
      - 'desktop/oyunopti_booster.py'
      - 'icon.svg'
      - 'scripts/build_windows_icon.py'
      - 'scripts/smoke_test_windows.py'
      - 'scripts/test_pro_licensing.py'
      - 'scripts/verify_exe_logo.py'
      - '.github/workflows/build-fps-booster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg Pillow
      - name: Generate multiresolution ICO from official logo
        run: python scripts/build_windows_icon.py
      - name: Upload Windows icon
        uses: actions/upload-artifact@v4
        with:
          name: oyunopti-windows-icon
          path: desktop/assets/oyunopti.ico
          if-no-files-found: error
  windows-build:
    needs: render-icon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download OyunOpti application icon
        uses: actions/download-artifact@v4
        with:
          name: oyunopti-windows-icon
          path: desktop/assets
      - name: Verify icon is present
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/assets/oyunopti.ico")) {
            throw "Official OyunOpti icon missing"
          }
          Write-Host "OyunOpti icon found"
      - name: Install packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller cryptography
      - name: Validate Python source
        run: python -m py_compile desktop/oyunopti_booster.py
      - name: Verify Pro license signatures and paywall
        run: python scripts/test_pro_licensing.py
      - name: Smoke test actual Tkinter app startup and polling
        run: python scripts/smoke_test_windows.py
      - name: Build branded Windows executable
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name OyunOpti-Pro-v1.1.0 --icon desktop/assets/oyunopti.ico --add-data "desktop/assets/oyunopti.ico;assets" desktop/oyunopti_booster.py
      - name: Inspect embedded Windows EXE icons
        run: python scripts/verify_exe_logo.py dist/OyunOpti-Pro-v1.1.0.exe
      - name: Verify EXE and generate checksum
        shell: pwsh
        run: |
          if (!(Test-Path "dist/OyunOpti-Pro-v1.1.0.exe")) {
            throw "Windows executable missing"
          }
          $hash=(Get-FileHash 'dist/OyunOpti-Pro-v1.1.0.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  OyunOpti-Pro-v1.1.0.exe" | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Publish branded release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: oyunopti-pro-v1.1.0
          name: OyunOpti Pro v1.1.0
          prerelease: false
          body: |
            OyunOpti Pro v1.1.0. Lisans aktivasyonunda cihaz koduyla
            otomatik Shopier lisans sayfasına geçiş butonu eklendi. Aktif cihaz-bağlı Ed25519 imzalı lisans olmadan
            FPS ölçümü, optimizasyon, performans analizi veya oyun profilleri açılamaz.
            İlk açılışta cihaz kodu ve lisans doğrulama ekranı görünür.
            Güvenlik gereği yalnızca orijinal Windows ayarlarına geri dönüş lisanssız da kullanılabilir.
            Windows EXE logosu imza öncesi kaynak logo ile karşılaştırılır.
            Otomatik ödeme ve lisans teslimi henüz entegre edilmedi.
            $10/ay hedef fiyat, ödeme entegrasyonu tamamlanınca satışa açılacak.
            FPS artışı garanti edilmez. Dosyanın bütünlüğünü SHA256SUMS.txt ile doğrulayın.
          files: |
            dist/OyunOpti-Pro-v1.1.0.exe
            dist/SHA256SUMS.txt
