name: Build OyunOpti FPS Booster
on:
  push:
    branches: [main]
    paths:
      - 'desktop/oyunopti_booster.py'
      - 'icon.svg'
      - 'scripts/build_windows_icon.py'
      - 'scripts/smoke_test_windows.py'
      - 'scripts/verify_exe_logo.py'
      - '.github/workflows/build-fps-booster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg Pillow
      - name: Generate multiresolution ICO from official logo
        run: python scripts/build_windows_icon.py
      - name: Upload Windows icon
        uses: actions/upload-artifact@v4
        with:
          name: oyunopti-windows-icon
          path: desktop/assets/oyunopti.ico
          if-no-files-found: error
  windows-build:
    needs: render-icon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download OyunOpti application icon
        uses: actions/download-artifact@v4
        with:
          name: oyunopti-windows-icon
          path: desktop/assets
      - name: Verify icon is present
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/assets/oyunopti.ico")) {
            throw "Official OyunOpti icon missing"
          }
          Write-Host "OyunOpti icon found"
      - name: Install packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Validate Python source
        run: python -m py_compile desktop/oyunopti_booster.py
      - name: Smoke test actual Tkinter app startup and polling
        run: python scripts/smoke_test_windows.py
      - name: Build branded Windows executable
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name OyunOpti-FPS-Booster-v0.5.2 --icon desktop/assets/oyunopti.ico --add-data "desktop/assets/oyunopti.ico;assets" desktop/oyunopti_booster.py
      - name: Inspect embedded Windows EXE icons
        run: python scripts/verify_exe_logo.py dist/OyunOpti-FPS-Booster-v0.5.2.exe
      - name: Verify EXE and generate checksum
        shell: pwsh
        run: |
          if (!(Test-Path "dist/OyunOpti-FPS-Booster-v0.5.2.exe")) {
            throw "Windows executable missing"
          }
          $hash=(Get-FileHash 'dist/OyunOpti-FPS-Booster-v0.5.2.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  OyunOpti-FPS-Booster-v0.5.2.exe" | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Publish branded release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fps-booster-v0.5.2-beta
          name: OyunOpti FPS Booster v0.5.2
          prerelease: true
          body: |
            Yeni sürüm: Windows EXE içinde OyunOpti'nin gerçek logosu kaynak dosyayla byte düzeyinde doğrulanır. Yeni dosya adı ikon önbelleği çakışmasını azaltır.
            Manuel FPS karşılaştırma, Pro beta PresentMon takibi ve geri alınabilir optimizasyon içerir.
            Beta özellikleri ücretsiz testtedir; abonelik satışı aktif değildir.
            FPS artışı garanti edilmez. Dosyanın bütünlüğünü SHA256SUMS.txt ile doğrulayın.
          files: |
            dist/OyunOpti-FPS-Booster-v0.5.2.exe
            dist/SHA256SUMS.txt
