name: Build OyunOpti FPS Booster
on:
  push:
    branches: [main]
    paths:
      - 'desktop/oyunopti_booster.py'
      - 'icon.svg'
      - 'scripts/build_windows_icon.py'
      - '.github/workflows/build-fps-booster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg Pillow
      - name: Generate multiresolution ICO from official logo
        run: python scripts/build_windows_icon.py
      - name: Upload Windows icon
        uses: actions/upload-artifact@v4
        with:
          name: oyunopti-windows-icon
          path: desktop/assets/oyunopti.ico
          if-no-files-found: error
  windows-build:
    needs: render-icon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download OyunOpti application icon
        uses: actions/download-artifact@v4
        with:
          name: oyunopti-windows-icon
          path: desktop/assets
      - name: Verify icon is present
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/assets/oyunopti.ico")) {
            throw "Official OyunOpti icon missing"
          }
          Write-Host "OyunOpti icon found"
      - name: Install packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Validate Python source
        run: python -m py_compile desktop/oyunopti_booster.py
      - name: Smoke test actual Tkinter app startup
        shell: pwsh
        run: |
          @'
          import sys
          sys.path.insert(0, 'desktop')
          from oyunopti_booster import App
          app = App()
          app.update()
          for page in ('FPS Ölçümü', 'OyunOpti Pro', 'Genel Bakış', 'Canlı FPS Pro'):
              app.show(page)
              app.update()
          app.destroy()
          print('Startup and navigation smoke test OK')
          '@ | python -
      - name: Build branded Windows executable
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name OyunOpti-FPS-Booster --icon desktop/assets/oyunopti.ico --add-data "desktop/assets/oyunopti.ico;assets" desktop/oyunopti_booster.py
      - name: Verify EXE and generate checksum
        shell: pwsh
        run: |
          if (!(Test-Path "dist/OyunOpti-FPS-Booster.exe")) {
            throw "Windows executable missing"
          }
          $hash=(Get-FileHash 'dist/OyunOpti-FPS-Booster.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  OyunOpti-FPS-Booster.exe" | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
      - name: Publish branded release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fps-booster-v0.5.1-beta
          name: OyunOpti FPS Booster v0.5.1
          prerelease: true
          body: |
            Yeni sürüm: OyunOpti'nin orijinal logosuyla Windows EXE, pencere ve görev çubuğu simgeleri.
            Manuel FPS karşılaştırma, Pro beta PresentMon takibi ve geri alınabilir optimizasyon içerir.
            Beta özellikleri ücretsiz testtedir; abonelik satışı aktif değildir.
            FPS artışı garanti edilmez. Dosyanın bütünlüğünü SHA256SUMS.txt ile doğrulayın.
          files: |
            dist/OyunOpti-FPS-Booster.exe
            dist/SHA256SUMS.txt
