name: Check OyunOpti Pro API
on:
  push:
    branches: [main]
    paths:
      - 'pro-config.js'
      - 'pro-backend/server.mjs'
      - '.github/workflows/check-pro-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check live health and disabled payments
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = "https://oyunopti-pro-api.onrender.com/api/health"
          last_error = None
          for retry in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=75) as response:
                      obj = json.load(response)
                  assert obj.get("service") == "OyunOpti Pro", obj
                  assert obj.get("paymentsEnabled") is False, "Safety alert: payments turned on unexpectedly"
                  print("PASS:", obj)
                  break
              except Exception as exc:
                  last_error = exc
                  print("Health check attempt failed:", str(exc))
                  if retry < 2: time.sleep(10)
          else:
              raise RuntimeError("Render API health not verified") from last_error
          PY
      - name: Confirm forged webhook rejected at deployed Render API
        shell: bash
        run: |
          python - <<'PY'
          import time, urllib.error, urllib.request
          url = "https://oyunopti-pro-api.onrender.com/api/shopier/webhook"
          request = urllib.request.Request(url, method="POST",
              data=b'{"id":"diagnostic-only"}',
              headers={"Content-Type":"application/json",
                       "Shopier-Event":"order.created",
                       "Shopier-Signature":"0"*64})
          for attempt in range(6):
              try:
                  urllib.request.urlopen(request,timeout=75)
                  raise RuntimeError("Unexpectedly accepted a forged webhook!")
              except urllib.error.HTTPError as err:
                  if err.code == 401:
                      print("PASS: deployed webhook checks signature before processing, sale remains closed.")
                      break
                  print("Deployed webhook returned",err.code,"expected 401 after update")
              if attempt == 5:
                  raise RuntimeError("Updated safe webhook endpoint has not been deployed.")
              time.sleep(15)
          PY
