services:
  - type: web
    name: oyunopti-pro-api
    runtime: node
    rootDir: pro-backend
    buildCommand: npm install --omit=dev --no-audit
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_ORIGIN
        value: https://oyunopti.com
      - key: SALE_ENABLED
        value: "false"
      - key: PRO_PRICE
        value: "10.00"
      - key: PRO_CURRENCY
        value: USD
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SHOPIER_PAT
        sync: false
      - key: SHOPIER_SHOP_SLUG
        sync: false
      - key: SHOPIER_WEBHOOK_TOKEN
        sync: false
      - key: LICENSE_PRIVATE_KEY_PEM
        sync: false
