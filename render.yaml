# OyunOpti Pro: safe trial infrastructure ONLY. Enable real payments after
# switching the database to a persistent paid plan and verifying Shopier.
services:
  - type: web
    name: oyunopti-pro-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: pro-backend
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_ORIGIN
        value: https://oyunopti.com
      - key: SALE_ENABLED
        value: "false"
      - key: PRO_PRICE
        value: "10.00"
      - key: PRO_CURRENCY
        value: USD
      - key: DATABASE_URL
        fromDatabase:
          name: oyunopti-pro-pg
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SHOPIER_PAT
        sync: false
      - key: SHOPIER_SHOP_SLUG
        sync: false
      - key: SHOPIER_WEBHOOK_TOKEN
        sync: false
      - key: LICENSE_PRIVATE_KEY_PEM
        sync: false

databases:
  - name: oyunopti-pro-pg
    region: frankfurt
    plan: free
    databaseName: oyunopti_pro
    user: oyunopti_pro
    ipAllowList: []
